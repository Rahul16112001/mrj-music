apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.mrj.music"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.mrj.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 300
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            storeFile file('mrj-release.keystore')
            storePassword System.getenv("MRJ_KEYSTORE_PASSWORD") ?: project.findProperty("MRJ_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("MRJ_KEY_ALIAS") ?: project.findProperty("MRJ_KEY_ALIAS") ?: "mrjmusic"
            keyPassword System.getenv("MRJ_KEY_PASSWORD") ?: project.findProperty("MRJ_KEY_PASSWORD") ?: ""
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':capacitor-android')

    // Core AndroidX & SplashScreen
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // AndroidX Media3 / ExoPlayer & Foreground MediaSession
    implementation "androidx.media3:media3-exoplayer:1.2.1"
    implementation "androidx.media3:media3-session:1.2.1"
    implementation "androidx.media3:media3-ui:1.2.1"
    implementation "androidx.media3:media3-common:1.2.1"
    implementation "androidx.media:media:1.7.0"

    // Networking (OkHttp 3 + Gson)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Background WorkManager for Smart Downloads
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    // Tests
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def capacitorProperties = file('capacitor.build.gradle')
    if (capacitorProperties.text) {
        apply from: 'capacitor.build.gradle'
    }
} catch(Exception e) {
    logger.info("capacitor.build.gradle not found, skipping")
}
