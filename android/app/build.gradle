apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.mrj.music"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.mrj.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 324
        versionName "3.17.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.8"
    }

    signingConfigs {
        release {
            storeFile file('mrj-release.keystore')
            storePassword System.getenv("MRJ_KEYSTORE_PASSWORD") ?: project.findProperty("MRJ_KEYSTORE_PASSWORD") ?: "mrjmusic123"
            keyAlias System.getenv("MRJ_KEY_ALIAS") ?: project.findProperty("MRJ_KEY_ALIAS") ?: "mrjmusic"
            keyPassword System.getenv("MRJ_KEY_PASSWORD") ?: project.findProperty("MRJ_KEY_PASSWORD") ?: "mrjmusic123"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Core AndroidX & SplashScreen
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity-compose:1.8.2"

    // Jetpack Compose (BOM 2024.02.01)
    def composeBom = platform('androidx.compose:compose-bom:2024.02.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Compose Navigation & Lifecycle ViewModels
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    // Coil for Compose Image Loading & AndroidX Palette
    implementation 'io.coil-kt:coil-compose:2.5.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // AndroidX Media3 / ExoPlayer 1.3.1 & Foreground MediaSession
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-session:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
    implementation "androidx.media3:media3-common:1.3.1"
    implementation "androidx.media:media:1.7.0"

    // Android Keystore-Backed EncryptedSharedPreferences (Security Crypto)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Networking (Retrofit 2 + OkHttp 3 + Gson)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Background WorkManager for Smart Downloads
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    // Tests
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
